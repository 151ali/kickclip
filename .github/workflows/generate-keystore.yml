name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Alias for the signing key'
        required: true
        default: 'kickclip'
      validity_days:
        description: 'Validity in days (10000 ≈ 27 years)'
        required: true
        default: '10000'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17 (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore and password
        run: |
          STORE_PASSWORD=$(openssl rand -base64 24)

          # Modern keytool defaults to PKCS12, which does not support a
          # separate key password - it silently ignores -keypass and uses
          # the store password for the key too. So we only ever generate
          # and store ONE password, used for both, to avoid a mismatched
          # pair that looks valid but fails at signing time.
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 \
            -validity ${{ inputs.validity_days }} \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=Kickclip, OU=Dev, O=Kickclip, L=Unknown, ST=Unknown, C=US"

          base64 -w 0 release.keystore > release.keystore.b64

          {
            echo "Copy these into GitHub repo secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo "KEYSTORE_BASE64  -> contents of release.keystore.b64"
            echo "KEYSTORE_PASSWORD -> $STORE_PASSWORD"
            echo "KEY_ALIAS         -> ${{ inputs.key_alias }}"
            echo "KEY_PASSWORD      -> $STORE_PASSWORD  (same as KEYSTORE_PASSWORD - PKCS12 keystores use one password for both)"
          } > keystore-info.txt

      - name: Upload keystore + credentials
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.b64
            keystore-info.txt
          retention-days: 1
